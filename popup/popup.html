<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FuriPop</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="icon">✨</span>
      <span class="title">FuriPop</span>
    </div>
    <span class="badge">X 專用版</span>
  </div>

  <div class="content">
    <div class="setting-item">
      <div class="setting-info">
        <span class="label">推特懸停標音</span>
        <span class="subtext">推文／名字／簡介懸停 · 反白整句讀音</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <button id="open-dictionary" type="button" style="width:100%;padding:10px;margin:12px 0;border-radius:8px;border:1px solid #1d9bf0;background:transparent;color:#1d9bf0;cursor:pointer">自訂名字與讀音</button>
    <div class="preview-box">
      <div class="preview-title">本機離線分詞 · v0.2.4</div>
      <div class="preview-text">
        滑鼠移過試試看：
        <span class="furipop-ruby preview-ruby" data-furigana="せんぱい">先輩</span>、
        <span class="furipop-ruby preview-ruby" data-furigana="えし">絵師</span>、
        <span class="furipop-ruby preview-ruby" data-furigana="だいじょうぶ">大丈夫</span>！
      </div>
    </div>
    <p style="font-size:12px;line-height:1.7;color:#71767b">中文主體的混合文章與語言不明的純漢字會保守略過，可用自訂詞典指定。首次懸停會載入詞典。推文不會傳到外部服務。人名、新詞與多音字仍可能需要人工確認。按 Esc 可關閉讀音。</p>
  </div>

  <div class="footer">
    <div class="status-indicator">
      <span class="dot"></span>
      <span id="status-text">X 讀音助手已啟用</span>
    </div>
    <a href="https://x.com" target="_blank" class="launch-btn">前往 X.com</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
